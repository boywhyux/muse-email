name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Cross-compile Rust .so + assembleRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk

      # cargo-ndk 不在 taiki-e/install-action 的支持清单里，会 fallback 到
      # 受 GitHub API 限流影响的 cargo-binstall。这里直接从源码装，最可靠。
      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # ubuntu-latest 已经预装 Android SDK。setup-android@v3 在新版 runner 上
      # 会因找不到旧 'tools' 包而崩（Failed to find package 'tools'），
      # 所以直接用 runner 自带的 sdkmanager，不再引入这个 action。
      - name: Install NDK / platform / build-tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then echo "::error::找不到 sdkmanager"; exit 1; fi
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;26.3.11579264" "platforms;android-36" "build-tools;37.0.0"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          NDK="$SDK/ndk/26.3.11579264"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          test -d "$NDK" || { echo "::error::NDK 未安装成功"; exit 1; }
          test -x "$SDK/build-tools/37.0.0/apksigner" || { echo "::error::apksigner 缺失"; exit 1; }

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Cross-compile domainmail-core for 3 ABIs
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release -p domainmail-core
          echo "--- produced .so files ---"
          find android/app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      # setup-gradle 的 gradle-version 已把 gradle 加进 PATH，直接用 CLI，
      # 不额外跑 `gradle wrapper`（那会多一次 settings 求值 + 插件解析，多一个失败点）。
      - name: Restore fixed signing key
        env:
          DM_KEYSTORE_B64: ${{ secrets.DM_KEYSTORE_B64 }}
          DM_KEYSTORE_PASSWORD: ${{ secrets.DM_KEYSTORE_PASSWORD }}
          DM_KEY_ALIAS: ${{ secrets.DM_KEY_ALIAS }}
          DM_KEY_PASSWORD: ${{ secrets.DM_KEY_PASSWORD }}
        run: |
          # 每次 runner 都是全新的，Gradle 自带的 debug.keystore 逐次随机生成，
          # 签名不一致会导致手机无法覆盖安装。这里从 Actions Secret 恢复同一把密钥。
          KEYSTORE="$RUNNER_TEMP/muse-email-release.p12"
          echo "$DM_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE" || { echo "::error::签名密钥为空"; exit 1; }
          echo "DM_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "DM_KEYSTORE_PASSWORD=$DM_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DM_KEY_ALIAS=$DM_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DM_KEY_PASSWORD=$DM_KEY_PASSWORD" >> "$GITHUB_ENV"
          # run_number 单调递增，保证新包 versionCode 一定大于旧包
          echo "DM_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      # 表情包位图以纯文本 base64 入库（Git Data API 只推文本），CI 解码到 xxxhdpi。
      # 432px @ xxxhdpi(4x) = 108dp，正好是 adaptive icon foreground 的画布尺寸。
      - name: Decode launcher mascot
        run: |
          mkdir -p android/app/src/main/res/drawable-xxxhdpi
          base64 -d branding/mascot.png.base64 > android/app/src/main/res/drawable-xxxhdpi/mascot.png
          test -s android/app/src/main/res/drawable-xxxhdpi/mascot.png || {
            echo "::error::表情包位图解码失败"; exit 1;
          }
          ls -lh android/app/src/main/res/drawable-xxxhdpi/mascot.png

      - name: Assemble signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      # 分包后一次出 3 个 APK（每 ABI 一个），逐个验签。
      - name: Verify APK signature
        run: |
          APKS=$(find android/app/build/outputs/apk/release -name '*.apk' | sort)
          COUNT=$(echo "$APKS" | grep -c . || true)
          if [ "$COUNT" -ne 3 ]; then echo "::error::应生成 3 个分包 APK，实际 $COUNT 个"; exit 1; fi
          echo "$APKS" | while read -r APK; do
            echo "== $APK =="
            ls -lh "$APK"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | head -8
          done

      # Gradle 在没有任何 Kotlin 源文件时也能"构建成功"，产出的却是没有
      # Activity 的空壳 APK（装上直接闪退）。这里强制校验产物内容。
      - name: Verify APK actually contains app classes
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile

          apks = sorted(glob.glob('android/app/build/outputs/apk/release/*.apk'))
          if len(apks) != 3:
              sys.exit(f'::error::应生成 3 个分包 APK，实际 {len(apks)} 个: {apks}')
          for apk in apks:
              z = zipfile.ZipFile(apk)
              dex = b''.join(z.read(n) for n in z.namelist() if n.endswith('.dex'))

              required = [
                  b'Lcom/muse/email/MainActivity;',
                  b'Lcom/muse/email/RustBridge;',
                  b'nativeCall',
                  b'domainmail_core',
              ]
              missing = [s.decode() for s in required if s not in dex]
              native = sorted(n for n in z.namelist() if n.endswith('libdomainmail_core.so'))
              print(apk, 'native libs:', native)

              if missing:
                  sys.exit(f'::error::{apk} 的 dex 缺少应用类: ' + ', '.join(missing))
              if len(native) != 1:
                  sys.exit(f'::error::{apk} 应恰好含 1 个 Rust .so，实际: ' + str(native))
          print('APK 内容校验通过：3 个分包各含 Activity / JNI 桥 / 自己 ABI 的 native 库')
          PY

      - name: Rename artifact
        run: |
          mkdir -p dist
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          for APK in android/app/build/outputs/apk/release/*.apk; do
            ABI=$(basename "$APK" | sed 's/^app-//; s/-release\.apk$//')
            cp "$APK" "dist/muse-email-${ABI}-${SAFE_REF:-dev}.apk"
          done
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-email-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
